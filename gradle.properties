# Plafond mémoire du build : le démon Gradle et le démon Kotlin ont chacun leur limite,
# pour que le build tienne sur une machine de 6 Go. Sans MaxMetaspaceSize, Gradle ne borne pas cette zone.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
